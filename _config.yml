title: My Offers
description: Every deal. Everywhere. Just for you.
theme: jekyll-theme-cayman
show_downloads: false

# Keep the Pages build on the project page. Source and tooling stay in the repo.
exclude:
  - node_modules
  - package-lock.json
  - src
  - scripts
  - server
  - migrations
  - attachments
  - AGENTS.md
  - eslint.config.mjs
  - vite.config.ts
  - tsconfig.json
  - vercel.json
  - startup.sh
  - package.json
